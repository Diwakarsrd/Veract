[project]
name = "veract"
version = "0.3.1"
description = "Local-first verifiable agent runtime with contract floors and zero dependencies."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Diwakar", email = "diwakarsrd28@gmail.com"}]
keywords = ["veract", "agent", "llm", "local-first", "verification", "ollama", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Diwakarsrd/Veract"
Issues = "https://github.com/Diwakarsrd/Veract/issues"

[project.scripts]
veract = "agent_runtime.cli:main"
agent = "agent_runtime.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_runtime"]

[tool.ruff]
line-length = 200
target-version = "py310"
extend-exclude = ["bench/work"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
# E701/E702: compact one-liners in CLI arg setup; S101: asserts in tests; S603/S607: subprocess is the job
# (argv-only, no shell, broker-gated); S310: urlopen schemes are checked by the broker before every call.
ignore = ["E401", "E741", "E701", "E702", "E731", "S101", "S603", "S607", "S310", "S110", "S112", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"bench/*" = ["S", "B", "E501"]
